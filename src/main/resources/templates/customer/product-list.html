<!DOCTYPE html>
<html th:replace="~{layout/store-layout :: layout(~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>

    <!-- Page Header & Banner -->
    <div class="page-header-box" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px;">
        <div>
            <h1 class="page-title">Sản Phẩm Mỹ Phẩm Nổi Bật</h1>
            <p style="color: var(--slate-600); margin: 0; font-size: 14px;">Chăm sóc và nâng niu làn da của bạn với các sản phẩm thiên nhiên cao cấp.</p>
        </div>
        <div style="font-size: 14px; color: var(--slate-500);">
            Tổng cộng: <strong th:text="${products != null ? products.size() : 0}" style="color: var(--slate-900);">0</strong> sản phẩm
        </div>
    </div>

    <!-- Flash Alert Messages -->
    <div th:if="${successMessage}" class="alert-box alert-success">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span th:text="${successMessage}">Thao tác thành công!</span>
    </div>

    <div th:if="${errorMessage}" class="alert-box alert-error">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
    </div>

    <!-- Products Grid -->
    <div class="products-grid">
        <div th:each="p : ${products}" class="product-item-card">
            <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://placehold.co/400x300'}"
                 th:alt="${p.name}"
                 class="product-thumb"/>

            <div class="product-body">
                <span class="product-cat" th:text="${p.categoryName != null && !p.categoryName.isEmpty() ? p.categoryName : 'Mỹ phẩm chính hãng'}">Danh mục</span>
                <h3 class="product-name" th:text="${p.name}">Tên sản phẩm</h3>
                <p style="font-size: 13px; color: var(--slate-600); margin: 0 0 12px 0; line-height: 1.4; flex-grow: 1;" th:text="${p.description}">Mô tả ngắn</p>

                <div class="product-price" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'">
                    0 đ
                </div>

                <div class="product-stock">
                    <span>Còn lại: </span>
                    <strong th:text="${p.stockQuantity} + ' sản phẩm'" style="color: var(--slate-800);">10</strong>
                </div>

                <!-- Add to Cart Form -->
                <form th:action="@{/cart/add}" method="post" style="display: flex; gap: 8px; margin-top: auto;">
                    <input type="hidden" name="productId" th:value="${p.id}"/>
                    <input type="number" name="quantity" value="1" min="1" th:max="${p.stockQuantity}" class="qty-input" style="width: 54px;" title="Số lượng mua"/>
                    <button type="submit" class="btn-primary-block" style="padding: 10px; font-size: 13px;">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        Thêm Giỏ
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>
</html>

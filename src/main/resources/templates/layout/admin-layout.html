<!DOCTYPE html>
<html th:fragment="layout(content)" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetic Shop - Hệ thống Quản trị</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Admin Master Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
</head>
<body>

<div class="admin-app">
    <!-- Backdrop for Mobile Drawer -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar()" aria-hidden="true"></div>

    <!-- Sidebar Navigation (Minimalist White & Crisp Borders) -->
    <aside id="adminSidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon">P</div>
            <div class="brand-title">Pinky<span>Cloud</span></div>
        </div>

        <nav class="sidebar-nav" aria-label="Admin Navigation">
<a class="nav-link" th:href="@{/admin/users}">Người dùng</a>
            <div class="nav-section-title">Tổng quan</div>
            <a th:href="@{/admin}" class="nav-link">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Bảng điều khiển</span>
            </a>

            <div class="nav-section-title">Quản lý bán hàng</div>
            <a th:href="@{/admin/categories}" class="nav-link active">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                <span>Danh mục</span>
            </a>

            <a th:href="@{/admin/products}" class="nav-link">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
                <span>Sản phẩm</span>
            </a>

            <a th:href="@{/admin/orders}" class="nav-link">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                </svg>
                <span>Đơn hàng</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            &copy; 2026 Cosmetic Shop Admin
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navigation Header -->
        <header class="admin-header">
            <div class="header-left">
                <!-- Hamburger Button for Mobile -->
                <button type="button" class="mobile-toggle-btn" onclick="toggleSidebar()" aria-label="Mở menu chuyển hướng">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Search Bar -->
                <div class="header-search-bar">
                    <span class="header-search-icon">
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </span>
                    <input type="text" 
                           class="header-search-input" 
                           placeholder="Tìm kiếm nhanh hệ thống..." 
                           aria-label="Tìm kiếm toàn hệ thống">
                </div>
            </div>

            <div class="header-right">
                <!-- User Profile & Avatar -->
                <div class="header-user-profile">
                    <div class="user-avatar" title="Quản trị viên">AD</div>
                    <div class="user-details">
                        <span class="user-name" sec:authentication="name">Quản trị viên</span>
                        <span class="user-badge">Super Admin</span>
                    </div>
                </div>

                <!-- Logout Form Button -->
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn" aria-label="Đăng xuất khỏi hệ thống">
                        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span>Đăng xuất</span>
                    </button>
                </form>
            </div>
        </header>

        <!-- Main Workspace Body -->
        <div class="content-body">
            <main th:replace="${content}"></main>
        </div>
    </div>
</div>

<!-- Mobile Sidebar Script -->
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('adminSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        if (sidebar && backdrop) {
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('active');
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/customer-layout :: layout(~{::main})}"
      lang="vi">
<main>
    <div class="container pd-wrapper">

        <!-- Breadcrumbs -->
        <div class="pd-breadcrumbs-bar">
            <nav class="pl-breadcrumbs" aria-label="Breadcrumb">
                <a th:href="@{/}">Trang chủ</a>
                <span>&gt;</span>
                <a th:href="@{/cart}">Giỏ hàng</a>
                <span>&gt;</span>
                <span style="color: var(--color-text-main); font-weight: 600;">Thanh toán</span>
            </nav>
        </div>

        <h1 class="section-title" style="margin-bottom: 24px;">Thanh Toán &amp; Đặt Hàng</h1>

        <!-- Business Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">Đã xảy ra lỗi khi đặt hàng!</span>
        </div>

        <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post">
            <div class="pd-grid" style="grid-template-columns: 1.35fr 1fr; gap: 28px; align-items: start;">

                <!-- Left Column: Shipping & Payment Information -->
                <div class="pd-info-card"
                     style="background: var(--surface-card); border: 1px solid var(--border-subtle); padding: 28px; box-shadow: var(--pl-shadow-sm);">
                    <h2 style="font-size: 1.125rem; font-weight: 700; color: var(--color-text-main); margin: 0 0 18px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle);">
                        Thông Tin Nhận Hàng
                    </h2>

                    <div class="account-form" style="margin: 0;">
                        <!-- Recipient Name -->
                        <div class="account-field">
                            <label for="recipientName">
                                Họ và tên người nhận <span style="color: var(--pl-danger);">*</span>
                            </label>
                            <input type="text"
                                   id="recipientName"
                                   th:field="*{recipientName}"
                                   placeholder="Ví dụ: Nguyễn Thu Hà"
                                   required/>
                            <div th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}" class="account-error"></div>
                        </div>

                        <!-- Recipient Phone -->
                        <div class="account-field">
                            <label for="recipientPhone">
                                Số điện thoại nhận hàng <span style="color: var(--pl-danger);">*</span>
                            </label>
                            <input type="text"
                                   id="recipientPhone"
                                   th:field="*{recipientPhone}"
                                   placeholder="Ví dụ: 0912345678"
                                   required/>
                            <div th:if="${#fields.hasErrors('recipientPhone')}" th:errors="*{recipientPhone}" class="account-error"></div>
                        </div>

                        <!-- Shipping Address -->
                        <div class="account-field">
                            <label for="shippingAddress">
                                Địa chỉ nhận hàng chi tiết <span style="color: var(--pl-danger);">*</span>
                            </label>
                            <textarea id="shippingAddress"
                                      th:field="*{shippingAddress}"
                                      rows="3"
                                      placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố"
                                      required></textarea>
                            <div th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}" class="account-error"></div>
                        </div>

                        <!-- Payment Method Selection -->
                        <div class="account-field" style="margin-top: 4px;">
                            <label>
                                Phương thức thanh toán <span style="color: var(--pl-danger);">*</span>
                            </label>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                                <label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: var(--pl-radius-md); background: var(--surface-bg); cursor: pointer;">
                                    <input type="radio" th:field="*{paymentMethod}" value="COD" style="width: 18px; min-height: 18px; height: 18px; margin-top: 2px; accent-color: var(--color-primary);"/>
                                    <div>
                                        <strong style="display: block; font-size: 0.9rem; color: var(--color-text-main);">Thanh toán khi nhận hàng (COD)</strong>
                                        <span style="font-size: 0.8rem; color: var(--color-text-muted);">Thanh toán bằng tiền mặt khi shipper giao tới tay bạn.</span>
                                    </div>
                                </label>

                                <label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: var(--pl-radius-md); background: var(--surface-bg); cursor: pointer;">
                                    <input type="radio" th:field="*{paymentMethod}" value="BANKING" style="width: 18px; min-height: 18px; height: 18px; margin-top: 2px; accent-color: var(--color-primary);"/>
                                    <div>
                                        <strong style="display: block; font-size: 0.9rem; color: var(--color-text-main);">Chuyển khoản Ngân hàng (QR Code)</strong>
                                        <span style="font-size: 0.8rem; color: var(--color-text-muted);">Quét mã VietQR chuyển khoản nhanh sau khi đặt đơn.</span>
                                    </div>
                                </label>
                            </div>
                            <div th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}" class="account-error"></div>
                        </div>

                        <!-- Order Note -->
                        <div class="account-field">
                            <label for="note">Ghi chú đơn hàng (Không bắt buộc)</label>
                            <input type="text"
                                   id="note"
                                   th:field="*{note}"
                                   placeholder="Ví dụ: Giao hàng vào giờ hành chính, gọi trước khi giao"/>
                            <div th:if="${#fields.hasErrors('note')}" th:errors="*{note}" class="account-error"></div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Order Review & Checkout Button -->
                <div class="pd-info-card"
                     style="background: var(--surface-card); border: 1px solid var(--border-subtle); padding: 24px; box-shadow: var(--pl-shadow-sm); position: sticky; top: 88px;">
                    <h2 style="font-size: 1.125rem; font-weight: 700; color: var(--color-text-main); margin: 0 0 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle);">
                        Đơn Hàng Của Bạn
                    </h2>

                    <!-- Mini Items List -->
                    <div style="max-height: 280px; overflow-y: auto; margin-bottom: 16px;">
                        <div th:each="item : ${cart.itemList}"
                             style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle);">
                            <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                                <img th:src="${item.imageUrl != null && !item.imageUrl.isBlank() ? item.imageUrl : '/IMG/default.png'}"
                                     th:alt="${item.productName}"
                                     style="width: 44px; height: 44px; object-fit: cover; border-radius: var(--pl-radius-sm); border: 1px solid var(--border-subtle); flex-shrink: 0;"/>
                                <div style="min-width: 0;">
                                    <div style="font-size: 0.85rem; font-weight: 600; color: var(--color-text-main);" th:text="${item.productName}">Tên món</div>
                                    <div style="font-size: 0.78rem; color: var(--color-text-muted);"
                                         th:text="${item.quantity} + ' x ' + ${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'">1 x 100.000 đ</div>
                                </div>
                            </div>
                            <strong style="font-size: 0.85rem; color: var(--color-text-main); white-space: nowrap;"
                                    th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</strong>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: var(--color-text-body);">
                        <span>Tổng số lượng:</span>
                        <strong th:text="${cart.totalQuantity} + ' sản phẩm'">0 sản phẩm</strong>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: var(--color-text-body);">
                        <span>Phí vận chuyển:</span>
                        <span style="color: var(--pl-success); font-weight: 600;">Miễn phí</span>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--border-subtle); font-size: 1.05rem; font-weight: 800; color: var(--color-text-main);">
                        <span>Tổng thanh toán:</span>
                        <span style="color: var(--color-primary); font-size: 1.25rem;"
                              th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</span>
                    </div>

                    <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px;">
                        <button type="submit" class="account-button">
                            Xác Nhận Đặt Hàng
                        </button>

                        <a th:href="@{/cart}" class="hero-secondary-btn" style="width: 100%; justify-content: center;">
                            &larr; Quay lại giỏ hàng
                        </a>
                    </div>
                </div>

            </div>
        </form>
    </div>
</main>
</html>

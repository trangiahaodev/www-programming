<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/customer-layout :: layout(~{::main})}">
<main class="account-panel">
    <h1>ĐĂNG NHẬP</h1>
    <div th:if="${successMessage}" th:text="${successMessage}" class="account-status" role="status"></div>
    <div th:if="${param.error}" class="account-error" role="alert">Email, mật khẩu không đúng hoặc tài khoản đã bị khóa.</div>
    <div th:if="${param.expired}" class="account-error" role="alert">Tài khoản đã thay đổi hoặc không còn hoạt động. Vui lòng đăng nhập lại.</div>
    <div th:if="${param.logout}" class="account-status" role="status">Bạn đã đăng xuất.</div>
    
    <form th:action="@{/login}" method="post" class="account-form">
        <div class="account-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="100" placeholder="VD: ban@example.com" required autofocus>
        </div>
        <div class="account-field">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
        </div>
        <button type="submit" class="account-button">Đăng nhập</button>
    </form>
    
    <p class="account-footer-text">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
</main>
</html>

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/customer-layout :: layout(~{::main})}">
<main class="account-panel">
    <h1>ĐĂNG KÝ</h1>
    <div class="account-error" th:each="error : ${#fields.globalErrors()}" th:text="${error}" role="alert"></div>
    
    <form th:action="@{/register}" method="post" th:object="${registration}" class="account-form">
        <div class="account-field">
            <label for="fullName">Họ tên</label>
            <input id="fullName" th:field="*{fullName}" maxlength="100" autocomplete="name" placeholder="Nguyễn Văn A" required>
            <div class="account-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="account-field">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" maxlength="100" autocomplete="email" placeholder="ban@example.com" required>
            <div class="account-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="account-field">
            <label for="password">Mật khẩu (ít nhất 8 ký tự)</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Tối thiểu 8 ký tự" required>
            <div class="account-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <div class="account-error" th:if="${#fields.hasErrors('passwordWithinLimit')}" th:errors="*{passwordWithinLimit}"></div>
        </div>
        <div class="account-field">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
            <div class="account-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            <div class="account-error" th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}"></div>
        </div>
        <button type="submit" class="account-button">Tạo tài khoản</button>
    </form>
    
    <p class="account-footer-text">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</main>
</html>

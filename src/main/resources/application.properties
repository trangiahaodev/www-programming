spring.application.name=www-programming

# Server port
server.port=8081

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DB_PinkyCloud;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security Default Dev Account
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.format_sql=false

# Encoding
spring.messages.encoding=UTF-8

# Thymeleaf
spring.thymeleaf.cache=false
app.ai.enabled=${AI_ENABLED:true}
app.ai.mock-response=${AI_MOCK_RESPONSE:Hiện chưa có kết nối AI trực tiếp. Dựa trên hành vi xem sản phẩm, bạn có thể tiếp tục khám phá các sản phẩm phù hợp với nhu cầu của mình.}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:__disabled__}
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.openai.api-key=${OPENAI_API_KEY:__disabled__}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Enable mail explicitly after SMTP is configured; registration never waits for SMTP.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

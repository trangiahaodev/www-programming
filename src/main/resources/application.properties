spring.application.name=www-programming

# Server port
server.port=8081

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DB_PinkyCloud;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security Default Dev Account
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.format_sql=false

# Encoding
spring.messages.encoding=UTF-8

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
spring.thymeleaf.encoding=UTF-8

# Spring AI
app.ai.enabled=${AI_ENABLED:true}
app.ai.mock-response=${AI_MOCK_RESPONSE:Hi\u1EC7n ch\u01B0a c\u00F3 k\u1EBFt n\u1ED1i AI tr\u1EF1c ti\u1EBFp. D\u1EF1a tr\u00EAn h\u00E0nh vi xem s\u1EA3n ph\u1EA9m, b\u1EA1n c\u00F3 th\u1EC3 ti\u1EBFp t\u1EE5c kh\u00E1m ph\u00E1 c\u00E1c s\u1EA3n ph\u1EA9m ph\u00F9 h\u1EE3p v\u1EDBi nhu c\u1EA7u c\u1EE7a m\u00ECnh.}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:__disabled__}
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.openai.api-key=${OPENAI_API_KEY:__disabled__}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Enable mail explicitly after SMTP is configured; registration never waits for SMTP.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Spring AI (keep the key in the environment, never commit it)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

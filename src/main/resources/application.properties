spring.application.name=www-programming

# Server port
server.port=8081

# MariaDB Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/db_pinkycloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=false

# SQL Init Configuration (SSOT Database)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql
spring.sql.init.encoding=UTF-8

# Spring Security Default Dev Account
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
spring.thymeleaf.encoding=UTF-8

# Spring AI
app.ai.enabled=${AI_ENABLED:true}
app.ai.mock-response=${AI_MOCK_RESPONSE:Hiện chưa có kết nối AI trực tiếp. Dựa trên hành vi xem sản phẩm, bạn có thể tiếp tục khám phá các sản phẩm phù hợp với nhu cầu của mình.}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:__disabled__}
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.openai.api-key=${OPENAI_API_KEY:__disabled__}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Mail Configuration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
